name: Sync MIT-Sandbox to Main

on:
  push:
    branches:
      - MIT-Sandbox

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-step-config:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch source branch history
        run: git fetch origin MIT-Sandbox --prune

      - name: Route changed files into step-config
        id: route
        shell: bash
        run: |
          set -euo pipefail

          base_sha="${{ github.event.before }}"
          head_sha="${{ github.sha }}"

          if [[ "$base_sha" == "0000000000000000000000000000000000000000" ]]; then
            changed_files="$(git diff-tree --no-commit-id --name-only -r --diff-filter=ACMR "$head_sha")"
          else
            changed_files="$(git diff --name-only --diff-filter=ACMR "$base_sha" "$head_sha")"
          fi

          if [[ -z "$changed_files" ]]; then
            echo "No added/updated files detected on MIT-Sandbox."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          while IFS= read -r source_path; do
            [[ -z "$source_path" ]] && continue

            file_name="$(basename "$source_path")"
            target_path=""

            case "$file_name" in
              Attribute_*)
                target_path="step-config/Attributes/$file_name"
                ;;
              BusinessRule_*)
                target_path="step-config/BusinessRule/$file_name"
                ;;
              ListOfValue_*)
                target_path="step-config/ListOfValues/$file_name"
                ;;
              giep_*|GIEP_*)
                target_path="step-config/GIEP/$file_name"
                ;;
              *)
                continue
                ;;
            esac

            if ! git cat-file -e "$head_sha:$source_path" 2>/dev/null; then
              echo "Skipping missing path in source commit: $source_path"
              continue
            fi

            mkdir -p "$(dirname "$target_path")"
            git show "$head_sha:$source_path" > "$target_path"
            echo "Mapped $source_path -> $target_path"
          done <<< "$changed_files"

          if git diff --quiet -- step-config; then
            echo "No routed file changes found for step-config."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create pull request to main
        id: cpr
        if: steps.route.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: sync MIT-Sandbox configs into step-config"
          title: "chore: sync MIT-Sandbox changes into main"
          body: |
            Automated sync from `MIT-Sandbox` push.

            Routing rules:
            - `Attribute_*` -> `step-config/Attributes/`
            - `BusinessRule_*` -> `step-config/BusinessRule/`
            - `ListOfValue_*` -> `step-config/ListOfValues/`
            - `giep_*` / `GIEP_*` -> `step-config/GIEP/`
          branch: automation/mit-sandbox-sync
          base: main
          delete-branch: true
          add-paths: |
            step-config/Attributes/**
            step-config/BusinessRule/**
            step-config/GIEP/**
            step-config/ListOfValues/**

      - name: Enable pull request auto-merge
        if: steps.route.outputs.has_changes == 'true' && steps.cpr.outputs.pull-request-number != ''
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          pull-request-number: ${{ steps.cpr.outputs.pull-request-number }}
          merge-method: squash
